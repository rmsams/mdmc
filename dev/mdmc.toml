[paths]
source = "drafts"
attachments = "attachments"
mail = "mail"
snapshots = "snapshots"
index = "index.db"

[accounts.dev]
from = "dev@example.com"
realname = "Dev Tester"
drafts = "mail/acct/Drafts"
sent = "mail/acct/Sent"

[defaults]
