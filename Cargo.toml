[package]
name = "mdmc"
version = "0.1.0"
edition = "2021"
description = "Markdown mail compiler — compile markdown draft notes to RFC 5322 email"

[[bin]]
name = "mdmc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
jsonschema = { version = "0.60.2", default-features = false }
mime-meta-language = { version = "1.1", default-features = false, features = ["compiler"] }
mail-builder = "0.4"
mail-parser = { version = "1", features = ["full_encoding"] }
inquire = "0.9"

[dev-dependencies]
clap_mangen = "0.3"

[profile.release]
lto = true
strip = true
